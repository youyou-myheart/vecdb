[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "vector-storage-client"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["grpcio>=1.76.0,<2", "protobuf>=6.33.5,<7"]
[tool.setuptools.packages.find]
where = ["."]
include = ["vectorstore*"]
