# Linux CI only: host networking matches advertised TiKV addresses used by tests.
name: vecdb-ci
services:
  pd:
    image: pingcap/pd:v8.5.8
    network_mode: host
    command:
      - --name=ci-pd
      - --data-dir=/data
      - --client-urls=http://127.0.0.1:12379
      - --advertise-client-urls=http://127.0.0.1:12379
      - --peer-urls=http://127.0.0.1:12380
      - --advertise-peer-urls=http://127.0.0.1:12380
    volumes:
      - pd-ci:/data
  tikv:
    image: pingcap/tikv:v8.5.8
    network_mode: host
    depends_on: [pd]
    command: [--config=/etc/tikv.toml, --addr=127.0.0.1:12160, --advertise-addr=127.0.0.1:12160, --status-addr=127.0.0.1:12180, --pd=127.0.0.1:12379, --data-dir=/data]
    volumes:
      - tikv-ci:/data
      - ./tikv-local.toml:/etc/tikv.toml:ro
  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    network_mode: host
    command: server -dir=/data -ip=127.0.0.1 -volume.max=8 -master.volumeSizeLimitMB=128 -master.telemetry=false -s3 -s3.port=18333 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - seaweed-ci:/data
      - ./s3.json:/etc/seaweedfs/s3.json:ro
volumes:
  pd-ci:
  tikv-ci:
  seaweed-ci:
