name: quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        lane: [unit, smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.lock.txt -r scripts/rpc-tools.txt
      - name: Go formatting
        run: |
          python - <<'PY'
          import subprocess
          files = subprocess.check_output(['git', 'ls-files', '-z', '*.go']).decode().split('\0')
          result = subprocess.run(['gofmt', '-l']+[p for p in files if p], capture_output=True, text=True, check=True)
          print(result.stdout)
          if result.stdout.strip():
              raise SystemExit('Go files need formatting')
          PY
      - name: Generated RPC consistency
        if: matrix.lane == 'unit'
        run: |
          mkdir -p .tools
          GOBIN="$PWD/.tools" bash scripts/go.sh install google.golang.org/protobuf/cmd/protoc-gen-go@v1.30.0
          GOBIN="$PWD/.tools" bash scripts/go.sh install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.3.0
          bash scripts/generate-rpc.sh
          git diff --exit-code -- api/vectorstore/v1 sdk/python/vectorstore/v1
      - name: Start isolated storage
        if: matrix.lane == 'smoke'
        run: |
          docker compose -f compose.ci.yaml up -d
          .venv/bin/python scripts/wait_dependencies.py
      - name: Quality gates
        run: .venv/bin/python scripts/quality.py --lane ${{ matrix.lane }}
      - name: Collect storage logs and stop dependencies
        if: always() && matrix.lane == 'smoke'
        run: |
          mkdir -p reports
          docker compose -f compose.ci.yaml logs --no-color > reports/ci-storage.log 2>&1
          docker compose -f compose.ci.yaml down -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-${{ matrix.lane }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: error
